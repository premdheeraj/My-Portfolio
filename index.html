<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('portfolio-theme');
          const prefersLight = matchMedia('(prefers-color-scheme: light)').matches;
          document.documentElement.dataset.theme = savedTheme || (prefersLight ? 'light' : 'dark');
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080909" />
    <meta name="description" content="Portfolio of Dheeraj Kumar Prajapati - AI data specialist and software engineer building reliable, human-centered systems." />
    <meta property="og:title" content="Dheeraj Kumar Prajapati | AI &amp; Software Engineer" />
    <meta property="og:description" content="AI systems, model evaluation, and human-centered software engineering." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://premdheeraj.github.io/My-Portfolio/" />
